[tools]
go = "latest"
golangci-lint = "latest"
sonar-scanner-cli = "latest"
sqlc = "1.31.1"

[tasks.generate]
run = "sqlc generate"
description = "Regenerate committed sqlc code (run after changing migrations or queries)"

[tasks.generate-check]
run = "sqlc diff"
description = "Verify committed sqlc code is up to date"

[tasks.build]
run = "go build -o jirascrap.out ."
description = "Build the jirascrap binary"

[tasks.run]
run = "go run ."
description = "Run without building"

[tasks.clean]
run = "rm -f jirascrap.out"
description = "Remove build artifacts"

[tasks.e2e]
run = "bash e2e/run.sh"
description = "Run e2e demo tape (requires vhs)"

[tasks.coverage]
description = "Go test coverage report"
run = "go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."

[tasks.sonar]
description = "Run tests with coverage and publish analysis to SonarQube"
depends = ["coverage"]
run = "bash scripts/sonar.sh scan"

[tasks.sonar-gate]
description = "Fail if the SonarQube quality gate for the last analysis is not passing"
run = "bash scripts/sonar.sh gate"

[tasks.sonar-issues]
description = "List the project's unresolved SonarQube issues as a flat, fixable list."
run = "bash scripts/sonar.sh issues"

[tasks.check]
description = "Post-development gate: format, vet, lint, tests, codegen drift, Sonar quality gate"
run = """
set -euo pipefail
test -z "$(gofmt -l .)" || { echo 'not formatted:'; gofmt -l .; exit 1; }
go vet ./...
golangci-lint run ./...
sqlc diff
mise run sonar
mise run sonar-gate
"""

[env]
JIRA_BASE_URL = { required = "Set your organization's Jira Base URL" }
JIRA_EMAIL = { required = "Set your Email used for Jira" }
JIRA_API_TOKEN = { required = "Get your API token from Atlassian Settings" }

JIRA_DB_PATH = { required = "Set your SQLite path" }
