[tools]
go = "latest"
golangci-lint = "latest"
sqlc = "1.31.1"

[tasks.generate]
run = "sqlc generate"
description = "Regenerate committed sqlc code (run after changing migrations or queries)"

[tasks.generate-check]
run = "sqlc diff"
description = "Verify committed sqlc code is up to date"

[tasks.build]
run = "go build -o jirascrap.out ."
description = "Build the jirascrap binary"

[tasks.run]
run = "go run ."
description = "Run without building"

[tasks.clean]
run = "rm -f jirascrap.out"
description = "Remove build artifacts"

[tasks.e2e]
run = "bash e2e/run.sh"
description = "Run e2e demo tape (requires vhs)"

[tasks.coverage]
description = "Go test coverage report"
run = "go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."

[tasks.check]
description = "Post-development gate: format, vet, lint, codegen drift, tests"
run = """
set -euo pipefail
test -z "$(gofmt -l .)" || { echo 'not formatted:'; gofmt -l .; exit 1; }
go vet ./...
golangci-lint run ./...
sqlc diff
go test -race ./... -count=1
"""

[env]
JIRA_BASE_URL = { required = "Set your organization's Jira Base URL" }
JIRA_EMAIL = { required = "Set your Email used for Jira" }
JIRA_API_TOKEN = { required = "Get your API token from Atlassian Settings" }

JIRA_DB_PATH = { required = "Set your SQLite path" }
