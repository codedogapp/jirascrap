name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./... -count=1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...

  codegen:
    name: Codegen up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve sqlc version from mise.toml
        id: sqlc
        run: |
          version="$(sed -n 's/^sqlc = "\(.*\)"$/\1/p' mise.toml)"
          if [ -z "$version" ]; then
            echo "could not resolve sqlc version from mise.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      - name: Check sqlc output is up to date
        run: sqlc diff

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Sonar can attribute issues to commits and compute new code.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./... -count=1

      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
